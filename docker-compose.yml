services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo_password   # for local demo only
      POSTGRES_DB: geo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://geo:geo_password@db:5432/geo
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: